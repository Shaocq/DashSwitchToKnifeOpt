name = DashSwitchToKnifeOpt
displayName = 奔跑自动切刀-优化版
description = 奔跑时自动切换到指定装备槽的武器，停止奔跑后恢复原手持物品；奔跑中按下瞄准或开火会自动切回原枪并中断奔跑，避免对敌挥刀；可选奔跑中禁止近战攻击。完整功能需要前置 HarmonyLib（工坊 3589088839），请将其放在本 mod 之前加载；未安装前置时切刀功能仍可正常使用。支持 ModSetting 设置界面（可选），也可编辑 mod 目录下的 config.txt（参考 config.example.txt）。
version = 1.0.0
tags = Quality of Life, Gameplay

